services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in .env}
      MYSQL_USER: ${DB_USER:?Set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    ports:
      - "${MYSQL_HOST_PORT:?Set MYSQL_HOST_PORT in .env}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: ${REDIS_IMAGE:?Set REDIS_IMAGE in .env}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:?Set REDIS_HOST_PORT in .env}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "${RABBITMQ_HOST_PORT:?Set RABBITMQ_HOST_PORT in .env}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:?Set RABBITMQ_MANAGEMENT_PORT in .env}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    environment: &django_environment
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:?Set DJANGO_SETTINGS_MODULE in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:?Set DJANGO_DEBUG in .env}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      # Always allow Compose DNS name `web` for in-network API calls (Streamlit).
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS in .env},web
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_HOST: ${COMPOSE_DB_HOST:?Set COMPOSE_DB_HOST in .env}
      DB_PORT: ${COMPOSE_DB_PORT:?Set COMPOSE_DB_PORT in .env}
      CACHE_URL: ${COMPOSE_CACHE_URL:?Set COMPOSE_CACHE_URL in .env}
      CACHE_KEY_PREFIX: ${CACHE_KEY_PREFIX:-mda}
      CACHE_DEFAULT_TIMEOUT: ${CACHE_DEFAULT_TIMEOUT:-300}
      CACHE_SOCKET_CONNECT_TIMEOUT: ${CACHE_SOCKET_CONNECT_TIMEOUT:-1}
      CACHE_SOCKET_TIMEOUT: ${CACHE_SOCKET_TIMEOUT:-1}
      CACHE_TTL_CATALOG: ${CACHE_TTL_CATALOG:-3600}
      CACHE_TTL_PORTFOLIO: ${CACHE_TTL_PORTFOLIO:-60}
      CACHE_TTL_CANDLES_HISTORICAL: ${CACHE_TTL_CANDLES_HISTORICAL:-600}
      CACHE_TTL_CANDLES_RECENT: ${CACHE_TTL_CANDLES_RECENT:-30}
      CACHE_TTL_RETURNS: ${CACHE_TTL_RETURNS:-300}
      CACHE_TTL_INDICATORS_HISTORICAL: ${CACHE_TTL_INDICATORS_HISTORICAL:-300}
      CACHE_TTL_INDICATORS_RECENT: ${CACHE_TTL_INDICATORS_RECENT:-30}
      CACHE_RECENT_WINDOW_SECONDS: ${CACHE_RECENT_WINDOW_SECONDS:-172800}
      CELERY_BROKER_URL: ${COMPOSE_CELERY_BROKER_URL:?Set COMPOSE_CELERY_BROKER_URL in .env}
      CELERY_RESULT_BACKEND: ${COMPOSE_CELERY_RESULT_BACKEND:?Set COMPOSE_CELERY_RESULT_BACKEND in .env}
      LOG_FILE_PATH: /var/log/mda/app.log
      INGESTION_LOCAL_ROOT: /data/ingestion
      INGESTION_SYSTEM_ROOT: /var/lib/mda/system
      INGESTION_SCAN_INTERVAL_SECONDS: ${INGESTION_SCAN_INTERVAL_SECONDS:-60}
      INGESTION_MAX_UPLOAD_BYTES: ${INGESTION_MAX_UPLOAD_BYTES:-1073741824}
      INGESTION_S3_BUCKET: ${INGESTION_S3_BUCKET:-}
      INGESTION_S3_PREFIX: ${INGESTION_S3_PREFIX:-}
      INGESTION_S3_REGION: ${INGESTION_S3_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      TIME_ZONE: ${TIME_ZONE:?Set TIME_ZONE in .env}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-localhost}
      EMAIL_PORT: ${EMAIL_PORT:-25}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-False}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@marketanalytics.com}
      FRONTEND_RESET_URL: ${FRONTEND_RESET_URL:-http://localhost:8501}
    ports:
      - "${WEB_HOST_PORT:?Set WEB_HOST_PORT in .env}:8000"
    volumes:
      - .:/app
      - mda_logs:/var/log/mda
      - ./sample_data:/data/ingestion
      - mda_system:/var/lib/mda/system
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment: *django_environment
    volumes:
      - .:/app
      - mda_logs:/var/log/mda
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
    # Change CELERY_WORKER_CONCURRENCY in .env to raise or lower the process count.
    command:
      - celery
      - -A
      - config
      - worker
      - --loglevel=INFO
      - --concurrency=${CELERY_WORKER_CONCURRENCY:?Set CELERY_WORKER_CONCURRENCY in .env}
    environment: *django_environment
    healthcheck:
      disable: true
    volumes:
      - .:/app
      - mda_logs:/var/log/mda
      - ./sample_data:/data/ingestion
      - mda_system:/var/lib/mda/system
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  streamlit:
    build:
      context: .
    working_dir: /app
    command:
      [
        "streamlit",
        "run",
        "streamlit_app/app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
      ]
    environment:
      # Repo root must be importable so `import streamlit_app` works.
      PYTHONPATH: /app
      # In-compose traffic must use the Docker service DNS name, not localhost.
      MDA_API_BASE_URL: ${COMPOSE_MDA_API_BASE_URL:-http://web:8000}
      MDA_API_TIMEOUT_SECONDS: ${MDA_API_TIMEOUT_SECONDS:-30}
      STREAMLIT_REFERENCE_CACHE_TTL: ${STREAMLIT_REFERENCE_CACHE_TTL:-300}
      STREAMLIT_MARKET_CACHE_TTL: ${STREAMLIT_MARKET_CACHE_TTL:-30}
    ports:
      - "${STREAMLIT_HOST_PORT:-8501}:8501"
    volumes:
      - .:/app
    depends_on:
      web:
        condition: service_started

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  mda_logs:
  mda_system:
